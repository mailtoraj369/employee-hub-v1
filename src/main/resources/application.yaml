spring:
  application:
    name: employee-hub
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlite:./data/myAcmeEmployee.sqlite
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
server:
  port: 9090
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

employees:
  pagination:
    default-page-number: 0
    default-page-size: 30
  salary:
    high-salary-threshold: 1000000
  defaults:
    currency: USD

langchain4j:
  google-ai-gemini:
    chat-model:
      api-key: ${GEMINI_API_KEY}
      model-name: ${MODEL_NAME:gemini-4-argon}
      temperature: 0.1
      max-output-tokens: 2048
      log-requests: false
      log-responses: false