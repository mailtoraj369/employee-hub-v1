spring:
  datasource:
    url: jdbc:sqlite:./<PROD_DATABASE_PATH>
    driver-class-name:  <>
  jpa:
    database-platform: <PROD_DATABASE>
    hibernate:
      ddl-auto: validate
    show-sql: false

employees:
  pagination:
    default-page-size: 50
  salary:
    high-salary-threshold: 10000000
  defaults:
    currency: USD