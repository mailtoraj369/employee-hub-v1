services:
  employee-hub-ui:
    image: employee-hub-ui-ssl:v1
    container_name: employee-hub-ui
    ports:
      - "8444:8444"
    environment:
      "employee.hub.service.base-url": "${EMPLOYEE_HUB_SERVICE_BASE_URL:-https://employee-hub-svc:8443}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      TRUST_STORE_PASSWORD: "${TRUST_STORE_PASSWORD:-pd}"
      CERT_PASSWORD: "${CERT_PASSWORD:-pd}"
    networks:
      - employee-hub-network
    depends_on:
      - employee-hub-svc

  employee-hub-svc:
    image: employee-hub-svc-ssl:v1
    container_name: employee-hub-svc
    ports:
      - "8443:8443"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      CERT_PASSWORD: "${CERT_PASSWORD:-pd}"
    networks:
      - employee-hub-network

networks:
  employee-hub-network:
    name: employee-hub-network
    driver: bridge